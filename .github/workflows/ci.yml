# Builds LeanSharp, builds the Lean standard library with it (no native Lean involved), and runs
# the API tests plus a slice of Lean's own test suite.
#
# NOTE: written on a development machine and not yet exercised on a hosted runner. Compiling
# `LeanSharp.Lean` (12.8M lines) needs a lot of memory; if the hosted runner is too small, use a
# larger runner or a self-hosted one.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  LEAN_COMMIT: 77f336f7ae6a60419d3882e0d5ca7ac3a2155528
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check out the Lean sources (library sources and tests only; nothing is compiled natively)
        uses: actions/checkout@v4
        with:
          repository: leanprover/lean4
          ref: ${{ env.LEAN_COMMIT }}
          path: lean4

      - name: Build
        run: |
          dotnet build src/LeanSharp.Cli -c Release
          dotnet build tests/LeanSharp.TestRunner -c Release
          dotnet build-server shutdown

      - name: Build the Lean standard library with LeanSharp
        run: dotnet src/LeanSharp.Cli/bin/Release/net10.0/LeanSharp.Cli.dll build-stdlib lean4/src artifacts/selfhost

      - name: API tests
        run: dotnet test tests/LeanSharp.Tests -c Release

      - name: Lean test suite (elab_fail pile)
        env:
          LEANSHARP_SYSROOT: ${{ github.workspace }}/artifacts/selfhost
        run: dotnet tests/LeanSharp.TestRunner/bin/Release/net10.0/LeanSharp.TestRunner.dll run --tests lean4/tests --pile elab_fail -j 2 --results artifacts/elab_fail.tsv

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: artifacts/*.tsv
